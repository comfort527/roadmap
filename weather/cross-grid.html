<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>專案天氣對照表</title></head><body><script>
(function(){
  try{
    var html='';
    for(var i=1;i<=6;i++){
      var xhr=new XMLHttpRequest();
      xhr.open('GET','./cross-grid-src/part'+i+'.txt?v=20260907d',false);
      xhr.send(null);
      if(xhr.status<200||xhr.status>=300)throw new Error('part'+i+' '+xhr.status);
      html+=xhr.responseText;
    }
    html=html.replace('</head>','<style>html[data-readonly=true] #addCol,html[data-readonly=true] #addRow{display:none!important}</style></head>');
    document.write(html);
  }catch(e){
    document.write('<main style="font:18px system-ui;padding:24px">網頁載入失敗：'+String(e&&e.message||e)+'</main>');
  }
})();
</script></body></html>
