<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>專案天氣對照表</title></head><body><div id="loading" style="font:18px system-ui;padding:24px">載入中…</div><script>
(async()=>{
  try{
    const files=Array.from({length:6},(_,i)=>`./cross-grid-src/part${i+1}.txt?v=20260907c`);
    const parts=await Promise.all(files.map(async url=>{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)throw new Error(`${url} ${r.status}`);
      return r.text();
    }));
    const html=parts.join('');
    if(!html.startsWith('<!doctype html>')||!html.includes('</html>'))throw new Error('原始網頁內容不完整');
    document.open();document.write(html);document.close();
  }catch(e){
    const n=document.getElementById('loading');
    if(n)n.textContent='網頁載入失敗：'+(e&&e.message?e.message:'來源檔讀取失敗')+'。請重新整理。';
    console.error(e);
  }
})();
</script></body></html>
